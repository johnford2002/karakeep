name: iOS App Release Build
# Disabled in this fork. The upstream workflow publishes a karakeep-branded build.
# Trigger manually via workflow_dispatch if you intend to produce your own build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Setup repo
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Setup Expo
        uses: expo/expo-github-action@8.2.1
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app
        working-directory: apps/mobile
        run: eas build --platform ios --local --non-interactive --output ${{ github.workspace }}/app-release.ipa
        env:
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: karakeep-ios
          path: ${{ github.workspace }}/app-release.ipa

      - name: Submit to TestFlight
        working-directory: apps/mobile
        run: eas submit --platform ios --profile production --path ${{ github.workspace }}/app-release.ipa --non-interactive
