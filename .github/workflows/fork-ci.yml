name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
env:
  FORCE_COLOR: 3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Lint
        run: pnpm lint && pnpm exec sherif

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Shared Package Tests
        working-directory: packages/shared
        run: pnpm test

      # TRPC and DB suites run in the db-tests matrix below, against both
      # dialects rather than only SQLite.

      - name: Workers Tests
        working-directory: apps/workers
        run: pnpm test

      # - name: Plugins Tests
      #   working-directory: packages/plugins
      #   run: pnpm test

      - name: E2E Tests
        working-directory: packages/e2e_tests
        run: pnpm test

      - name: Upload Docker Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-docker-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: packages/e2e_tests/setup/docker-logs/
          retention-days: 7
  db-tests:
    # The suites that touch a database, run against both dialects.
    #
    # These used to run on in-memory SQLite only, which cannot see
    # dialect-specific bugs at all: drizzle's `.run()`/`.all()` exist on the
    # SQLite query builders but not on postgres-js, and LIKE is
    # case-insensitive on SQLite but not PostgreSQL. Both classes reached
    # production. Running the same suites on both dialects is what catches them.
    name: db-tests (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgresql]

    services:
      postgres:
        # Pinned to the major version production runs.
        image: postgres:18
        env:
          POSTGRES_USER: karakeep
          POSTGRES_PASSWORD: karakeep
          POSTGRES_DB: karakeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_DIALECT: ${{ matrix.dialect }}
      # Ignored on the SQLite leg; the suites only read it when the dialect is
      # postgresql.
      DATABASE_URL: postgresql://karakeep:karakeep@localhost:5432/karakeep
      # The app pre-warms this many connections at startup. Tests do not need a
      # warm pool, and each vitest worker would otherwise open ten sockets.
      DATABASE_POOL_SIZE: 1
      NEXTAUTH_SECRET: test-secret

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: DB Tests
        working-directory: packages/db
        run: pnpm test

      - name: TRPC Tests
        working-directory: packages/trpc
        run: pnpm test

  open-api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Regenerate OpenAPI spec
        working-directory: packages/open-api
        run: pnpm run generate

      - name: Check for changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: Generated files are not up to date!"
            echo "The following files have changes:"
            git status --porcelain
            echo ""
            echo "Please regenerate the files locally with (pnpm run generate) and commit the changes."
            git diff
            exit 1
          else
            echo "✅ Generated files are up to date!"
          fi
